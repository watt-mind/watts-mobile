name: CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other; push runs are keyed per-commit so they
  # never queue behind or cancel each other during rapid merges.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 9.13.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Validate Maestro flow definitions
        run: pnpm test:e2e:validate

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public --json > /dev/null

  release-policy:
    name: develop to master only
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Require the develop integration branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "develop" ]; then
            echo "PRs into master must come from develop; received '$HEAD_BRANCH'."
            exit 1
          fi
          echo "Release PR source is develop."
